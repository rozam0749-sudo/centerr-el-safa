<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سنتر الصفا التعليمي</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="سنتر الصفا">
    <style>
        body { font-family: 'Cairo', Tahoma, sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; text-align: center; box-sizing: border-box; }
        .brand-icon { width: 70px; height: 70px; background-color: #007bff; color: white; font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center; border-radius: 50%; margin: 0 auto 15px auto; box-shadow: 0 4px 12px rgba(0, 123, 255, 0.35); }
        .install-box { background: #e8f5e9; border: 1px solid #c8e6c9; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: right; }
        .install-btn { background-color: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; color: #495057; font-weight: bold; font-size: 13px; }
        input, select { width: 100%; padding: 11px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; font-size: 13px; }
        .login-btn { background-color: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand-icon">الصفا</div>
        <h2 style="color: #2c3e50; margin: 0; font-size: 20px;">سنتر الصفا التعليمي</h2>
        <p style="color: #6c757d; font-size: 13px; margin: 5px 0 20px 0;">منصة الإدارة التعليمية</p>

        <!-- زر التثبيت الظاهر للمستخدم -->
        <div class="install-box" id="installPromptBox" style="display:none;">
            <p style="margin: 0; font-size: 13px; color: #2e7d32; font-weight: bold;">📱 تثبيت التطبيق على هاتفك:</p>
            <p style="margin: 5px 0 10px 0; font-size: 12px; color: #555;">ثبت المنصة كأيقونة مستقلة على شاشتك الرئيسية للوصول السريع.</p>
            <button class="install-btn" id="installAppBtn">تثبيت التطبيق الآن</button>
        </div>

        <!-- نموذج تسجيل الدخول السريع -->
        <div style="margin-top: 20px;">
            <div class="form-group">
                <label>اختر صفة الدخول:</label>
                <select id="roleSelect">
                    <option value="طالب">طالب</option>
                    <option value="ولي أمر">ولي أمر</option>
                    <option value="مدرس">مدرس</option>
                    <option value="مدير">مدير</option>
                </select>
            </div>
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="usernameInput" placeholder="أدخل اسم المستخدم">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور">
            </div>
            <button class="login-btn" onclick="alert('يرجى تسجيل الدخول بعد تثبيت التطبيق')">تسجيل الدخول</button>
        </div>
    </div>

    <script>
        let deferredPrompt;
        const installBox = document.getElementById('installPromptBox');
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBox.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBox.style.display = 'none';
                }
                deferredPrompt = null;
            } else {
                alert("من قائمة المتصفح (النقاط الثلاث أعلى اليمين) اختر 'إضافة إلى الشاشة الرئيسية' أو 'تثبيت التطبيق'.");
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
    </script>
</body>
</html>
